# Developer use only (e.g. `FILMLOG_DB=/tmp/filmlog-dev.db uv run alembic revision --autogenerate -m "..."`).
# The application runs migrations itself at start-up (see src/filmlog/db/migrate.py).
[alembic]
script_location = src/filmlog/db/migrations
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
